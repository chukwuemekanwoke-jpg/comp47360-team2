name: CI

on:
  push:
    branches: [main, develop, integrate]
  pull_request:
    branches: [main, develop, integrate]

jobs:
  openapi-lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs/openapi-v0.yaml
        run: npx --yes @redocly/cli lint docs/openapi-v0.yaml

  web:
    name: Web app (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - name: Install
        working-directory: frontend/web-app
        run: npm ci
      - name: Lint
        working-directory: frontend/web-app
        run: npm run lint
      - name: Build
        working-directory: frontend/web-app
        run: npm run build

  mobile:
    name: Mobile app (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/mobile-app/package-lock.json
      - name: Install
        working-directory: frontend/mobile-app
        run: npm ci
      - name: Lint
        working-directory: frontend/mobile-app
        run: npm run lint

  backend:
    name: API gateway (install + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - name: Install
        working-directory: backend/api-gateway
        run: npm ci
      - name: Test
        working-directory: backend/api-gateway
        run: npm test

  ml-pipeline:
    name: ML pipeline (FastAPI install + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ml-pipeline/fastapi-app
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: ml-pipeline/fastapi-app
        run: python -c "import main"
