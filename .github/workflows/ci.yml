name: CI

on:
  push:
    branches: [main, develop, integrate]
  pull_request:
    branches: [main, develop, integrate]

jobs:
  openapi-lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs/openapi-v0.yaml
        run: npx --yes @redocly/cli lint docs/openapi-v0.yaml

  web:
    name: Web app (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json 
      - name: Install dependencies
        run: npm ci 
      - name: Lint
        run: npm run lint --workspace=frontend/web-app
      - name: Unit tests
        run: npm run test:coverage --workspace=frontend/web-app
      - name: Build
        run: npm run build --workspace=frontend/web-app

  mobile:
    name: Mobile app (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json # Points to root lockfile
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=frontend/mobile-app

  backend:
    name: API gateway (install + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - name: Install
        working-directory: backend/api-gateway
        run: npm ci
      - name: Check API matches OpenAPI contract
        working-directory: backend/api-gateway
        run: npm run check:openapi-drift
      - name: Test
        working-directory: backend/api-gateway
        run: npm run test:coverage

  ml-pipeline:
    name: ML pipeline (FastAPI install + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ml-pipeline/fastapi-app
        run: pip install -r requirements.txt
      - name: Unit tests
        working-directory: ml-pipeline/fastapi-app
        run: python -m pytest -q
