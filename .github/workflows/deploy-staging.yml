name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - name: Install
        working-directory: frontend/web-app
        run: npm ci
      - name: Build
        working-directory: frontend/web-app
        run: npm run build
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web-app/dist
          retention-days: 7

  build-backend:
    name: Install backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - name: Install
        working-directory: backend/api-gateway
        run: npm ci

  deploy:
    name: Deploy to staging (placeholder)
    needs: [build-web, build-backend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/web-app/dist
      - name: Deploy (TODO)
        run: |
          echo "No staging infra configured yet."
          echo "Replace this step once a deploy target is chosen (e.g. Docker registry push, SSH, Vercel/Netlify, etc.)."
          echo "Artifacts ready: frontend/web-app/dist"
