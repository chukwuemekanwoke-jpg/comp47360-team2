name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - name: Install
        working-directory: frontend/web-app
        run: npm ci
      - name: Build
        working-directory: frontend/web-app
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
        run: npm run build
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web-app/dist
          retention-days: 7

  build-backend:
    # api-gateway itself deploys separately via its own Cloud Build trigger
    # (continuous deploy from the develop branch, configured directly on the
    # Cloud Run service). This job is just a CI sanity check that it installs.
    name: Verify backend installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json
      - name: Install
        working-directory: backend/api-gateway
        run: npm ci

  deploy:
    name: Deploy web app to Firebase Hosting
    needs: [build-web, build-backend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/web-app/dist
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TABL_APP_STAGING }}
          projectId: tabl-app-staging
          channelId: live
