server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the API so the browser only ever talks to this origin.
    # Docker's embedded DNS is resolved per-request via the variable below
    # rather than once at startup, so nginx still boots if the api-gateway
    # container happens to be down or restarting.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_gateway http://api-gateway:3001;
        proxy_pass $api_gateway$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Same-origin health passthrough, handy for `curl localhost:5173/health`.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_gateway_health http://api-gateway:3001;
        proxy_pass $api_gateway_health$request_uri;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path renders the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
