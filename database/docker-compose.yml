# Tablé local PostgreSQL (development only)
# Usage:
#   docker compose up -d
#   npm run migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: table-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: table_dev
    volumes:
      - table_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d table_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  table_pg_data:
