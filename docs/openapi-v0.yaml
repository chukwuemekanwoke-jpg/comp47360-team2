openapi: 3.0.3
info:
  title: Tablé API
  version: 0.1.0
  description: MVP contract v0 (BE-3). See docs/api-contract-v0.md for narrative spec.

servers:
  - url: http://localhost:3001
    description: Local API gateway

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Restaurants
  - name: Bookings
  - name: Offers
  - name: Campaigns

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/status:
    get:
      tags: [Health]
      summary: API gateway status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  apiVersion:
                    type: string
                    example: v1
                  database:
                    type: string
                    enum: [connected, error, not_configured]
                  databaseMessage:
                    type: string

  /api/v1/config/maps-key:
    get:
      tags: [Health]
      summary: Google Maps browser key for the web app's location picker
      description: >-
        Serves the browser-restricted Maps JS key (MAPS_JS_API_KEY) from Secret
        Manager at runtime — a separate key from the server-side Routes API
        one, so it never sits in the frontend build/source control. Returns
        404 if unconfigured; callers should fall back to manual lat/lng entry.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current JWT (server-side logout)
      security:
        - BearerAuth: []
        - UserIdHeader: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: logged_out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordRequest"
      responses:
        "200":
          description: Acknowledged (same response whether or not the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Create user (dummy onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/preferences:
    patch:
      tags: [Users]
      summary: Update preferences (Story 1.1)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/restaurants:
    post:
      tags: [Restaurants]
      summary: Create a restaurant for the authenticated manager
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/restaurants/nearby:
    get:
      tags: [Restaurants]
      summary: Nearby available restaurants (Story 2.1 / 2.2)
      parameters:
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Required unless `neighborhood` is provided.
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Required unless `neighborhood` is provided.
        - name: radiusM
          in: query
          schema:
            type: integer
            default: 1500
        - name: neighborhood
          in: query
          schema:
            type: string
          description: Manhattan neighbourhood name; geocoded when lat/lng omitted (Story 2.2).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  origin:
                    $ref: "#/components/schemas/GeoPoint"
                  radiusM:
                    type: integer
                  restaurants:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestaurantSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}:
    get:
      tags: [Restaurants]
      summary: Restaurant detail
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/settings:
    patch:
      tags: [Restaurants]
      summary: Update accessibility settings for a managed restaurant
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantSettingsPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/revpash:
    get:
      tags: [Restaurants]
      summary: RevPASH summary for merchant dashboard (Story 5.1)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
        - name: window
          in: query
          schema:
            type: string
            enum: [today, week, month]
            default: today
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevpashSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/eta:
    get:
      tags: [Restaurants]
      summary: ETA vs hold window (Stories 3.1, 3.2)
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: mode
          in: query
          schema:
            $ref: "#/components/schemas/TransportMode"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtaResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/bookings:
    get:
      tags: [Bookings]
      summary: List bookings for a restaurant (manager only)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestaurantBooking"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/bookings:
    post:
      tags: [Bookings]
      summary: Create booking
      description: >
        Creates a confirmed booking. Rejects with 409 if the user already has an
        active (pending/confirmed) booking. Expired holds are lapsed first.
        After insert, only the newest 5 bookings for the user are retained.
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking (Story 4.2)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/bookings/{bookingId}/status:
    patch:
      tags: [Bookings]
      summary: Update booking status (merchant dashboard, Story 5.2)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/me/bookings:
    get:
      tags: [Bookings]
      summary: List the current user's bookings
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/offers:
    get:
      tags: [Offers]
      summary: Flash deal inbox (Story 4.1)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OfferStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/OfferInboxItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/offers/{offerId}/accept:
    post:
      tags: [Offers]
      summary: Accept flash deal
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptOfferResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/restaurants/{restaurantId}/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns for a restaurant (manager only)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Campaigns]
      summary: Start lull-mitigation campaign (Story 5.2)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/restaurants/{restaurantId}/campaigns/{campaignId}/offers:
    get:
      tags: [Campaigns]
      summary: List offers for a campaign (manager live tracker)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagerOfferItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/campaigns/{campaignId}/revpash-lift:
    get:
      tags: [Campaigns]
      summary: Organic-vs-deal RevPASH comparison for a campaign (SCRUM-309 / TABL-215)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRevpashLift"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/restaurants/{restaurantId}/campaigns/{campaignId}/cancel:
    post:
      tags: [Campaigns]
      summary: Cancel an active campaign (manager only)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/restaurants/{restaurantId}/campaigns/active:
    get:
      tags: [Campaigns]
      summary: Get the active campaign for a restaurant (manager only)
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    nullable: true
                    $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Preferred auth. Obtain via POST /api/v1/auth/login or /auth/register.
    UserIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Interim dev/demo auth until all clients use JWT.

  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Interim auth header. Prefer Authorization Bearer JWT.
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests on a rate-limited route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

    GeoPoint:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number

    BudgetTier:
      type: string
      enum: [TIER_1, TIER_2, TIER_3]

    TransportMode:
      type: string
      enum: [walking, driving, transit, cycling]

    EtaSource:
      type: string
      description: >
        How etaMinutes was derived. "google" = live Google Routes API
        (computeRouteMatrix); "estimate" = local haversine + fixed-speed
        fallback when no API key is configured or the call fails/times out.
      enum: [google, estimate]

    OfferStatus:
      type: string
      enum: [pending, accepted, expired, revoked]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        budgetTier:
          type: string
          enum: [TIER_1, TIER_2, TIER_3]
          nullable: true
        dietaryTags:
          type: array
          items:
            type: string
        preferredCuisines:
          type: array
          items:
            type: string
        diningStyles:
          type: array
          items:
            type: string
        requiresWheelchairAccess:
          type: boolean
          description: Diner needs step-free access.
        requiresSensoryFriendly:
          type: boolean
          description: Diner needs a low-stimulation room.
        createdAt:
          type: string
          format: date-time
        lastLat:
          type: number
        lastLng:
          type: number

    AuthRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    AuthResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    AuthMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        userId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
          nullable: true

    UserPreferences:
      type: object
      minProperties: 1
      properties:
        budgetTier:
          $ref: "#/components/schemas/BudgetTier"
        dietaryTags:
          type: array
          items:
            type: string
        preferredCuisines:
          type: array
          items:
            type: string
        diningStyles:
          type: array
          items:
            type: string
        requiresWheelchairAccess:
          type: boolean
        requiresSensoryFriendly:
          type: boolean
        lastLat:
          type: number
        lastLng:
          type: number

    RestaurantSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        neighborhood:
          type: string
        availableTableCount:
          type: integer
        capacity:
          type: integer
        cuisine:
          type: string
        busynessScore:
          type: number
        rating:
          type: number
          minimum: 0
          maximum: 5
          nullable: true
        reviews:
          type: integer
          minimum: 0
          nullable: true
        distanceMeters:
          type: number
        isWheelchairAccessible:
          type: boolean
        sensoryFriendly:
          type: boolean

    RestaurantDetail:
      allOf:
        - $ref: "#/components/schemas/RestaurantSummary"
        - type: object
          properties:
            addressLine:
              type: string
            holdWindowMinutes:
              type: integer
            phone:
              type: string

    CreateRestaurantRequest:
      type: object
      required: [name, addressLine, phone, latitude, longitude, cuisine]
      properties:
        name:
          type: string
        addressLine:
          type: string
        phone:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        cuisine:
          type: string
        neighborhood:
          type: string
        isWheelchairAccessible:
          type: boolean
        sensoryFriendly:
          type: boolean

    RestaurantSettingsPatch:
      type: object
      properties:
        isWheelchairAccessible:
          type: boolean
        sensoryFriendly:
          type: boolean

    EtaResult:
      type: object
      properties:
        restaurantId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        etaMinutes:
          type: integer
        holdWindowMinutes:
          type: integer
        canBook:
          type: boolean
        message:
          type: string
        source:
          $ref: "#/components/schemas/EtaSource"

    CreateBookingRequest:
      type: object
      required: [restaurantId, transportMode, userLat, userLng]
      properties:
        restaurantId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        userLat:
          type: number
        userLng:
          type: number
        offerId:
          type: string
          format: uuid
          nullable: true
        partySize:
          type: integer
          minimum: 1
          maximum: 20
          description: Party size for RevPASH revenue simulation (defaults to 2).

    BookingStatusPatch:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed, no_show]

    RevpashSummary:
      type: object
      required: [restaurantId, window, revenue, availableSeatHours, revpash]
      properties:
        restaurantId:
          type: string
          format: uuid
        window:
          type: string
          enum: [today, week, month]
        revenue:
          type: number
        availableSeatHours:
          type: number
        revpash:
          type: number

    CampaignRevpashLift:
      type: object
      required: [campaignId, organicRevpash, dealRevpash, liftPercent, offPeak]
      properties:
        campaignId:
          type: string
          format: uuid
        organicRevpash:
          type: number
          description: Trailing 30-day baseline RevPASH for this restaurant at the campaign's hour-of-day, excluding any campaign-linked bookings.
        dealRevpash:
          type: number
          description: RevPASH from bookings tied to this campaign, over seat-hours available during its active window.
        liftPercent:
          type: number
          description: Percent difference between dealRevpash and organicRevpash; 0 when there's no organic baseline to compare against.
        offPeak:
          type: boolean
          description: True when the campaign's hour sits below the restaurant's median hourly revpash.

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
          nullable: true
        campaignId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        etaMinutes:
          type: integer
        holdExpiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [google, estimate]
          nullable: true
          description: >
            ETA source resolved at booking-confirmation time. Present on
            POST /bookings; omitted from historical bookings in
            GET /users/me/bookings (not persisted).

    RestaurantBooking:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          required: [userDisplayName]
          properties:
            userDisplayName:
              type: string
              description: Display name of the diner who placed the booking.

    ManagerOfferItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        userDisplayName:
          type: string
        status:
          $ref: "#/components/schemas/OfferStatus"
        expiresAt:
          type: string
          format: date-time
        secondsRemaining:
          type: integer
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    OfferInboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        restaurantName:
          type: string
        status:
          $ref: "#/components/schemas/OfferStatus"
        discountPercent:
          type: integer
        expiresAt:
          type: string
          format: date-time
        secondsRemaining:
          type: integer
        canAccept:
          type: boolean

    AcceptOfferResponse:
      type: object
      properties:
        offerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
        booking:
          $ref: "#/components/schemas/Booking"

    CreateCampaignRequest:
      type: object
      required: [tableQuota, discountPercent]
      properties:
        tableQuota:
          type: integer
          minimum: 1
          description: Must not exceed the restaurant capacity.
        discountPercent:
          type: integer
          minimum: 10
          maximum: 50
        ttlMinutes:
          type: integer
          minimum: 10
          maximum: 60
          default: 15
          description: >
            Single shared TTL for the campaign and its offers (minutes).
            Defaults to 15 when omitted.

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        status:
          type: string
        tableQuota:
          type: integer
        tablesClaimed:
          type: integer
        discountPercent:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Campaign TTL end (MVP same as offer TTL, 900 seconds from create).
        secondsRemaining:
          type: integer
          nullable: true
          description: Seconds until campaign expires; 0 when expired or past TTL.
